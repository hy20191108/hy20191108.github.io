{% assign profile = site.data.profile.locales[page.lang] %}
<div style="display: flex; align-items: center; flex-wrap: wrap;">
  <div style="flex: 0 0 auto; margin-right: 20px;">
    <img src="{{ '/images/yoshioka.jpg' | relative_url }}" alt="{{ profile.image_alt }}" style="width: 200px; max-width: 100%; height: auto;">
  </div>
  <div style="flex: 1; word-break: keep-all;">
    <h1>{{ profile.heading }}</h1>
    <p>
      {% for line in profile.affiliation %}{{ line }}{% unless forloop.last %}<br>
      {% endunless %}{% endfor %}
    </p>
  </div>
</div>
