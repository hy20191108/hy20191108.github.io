{% assign profile = site.data.profile.locales[page.lang] %}
<div class="profile-header">
  <div class="profile-header__image">
    <img src="{{ '/images/yoshioka.jpg' | relative_url }}" alt="{{ profile.image_alt }}">
  </div>
  <div class="profile-header__details">
    <h1>{{ profile.heading }}</h1>
    <p>
      {% for line in profile.affiliation %}{{ line }}{% unless forloop.last %}<br>
      {% endunless %}{% endfor %}
    </p>
  </div>
</div>
